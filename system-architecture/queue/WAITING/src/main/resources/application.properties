spring.application.name=waiting
server.port=${SERVER_PORT:8081}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

waiting-queue.defaults.max-waiting-users=5000
waiting-queue.defaults.max-active-users=1000
waiting-queue.defaults.admission-rate-per-second=100
waiting-queue.defaults.waiting-inactivity-timeout-seconds=300
waiting-queue.defaults.active-inactivity-timeout-seconds=300
waiting-queue.defaults.max-active-duration-seconds=600
waiting-queue.defaults.data-retention-seconds=86400

waiting-queue.worker.admission-interval-ms=500
waiting-queue.worker.admission-lease-ms=450
waiting-queue.worker.admission-batch-size=50
waiting-queue.worker.expiration-interval-ms=1000
waiting-queue.worker.expiration-lease-ms=900
waiting-queue.worker.expiration-batch-size=500

management.endpoints.web.exposure.include=health,metrics
